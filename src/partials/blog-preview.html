<section class="blog-preview">
  <div class="container">
    <h2 class="blog-preview__title title">Наши публикации</h2>
    <div class="blog-preview__swiper-container">
      <div class="blog-preview__swiper" data-swiper="navigation">
        <ul class="blog-preview__swiper-wrapper">
          <li class="blog-preview__slide">
            <div class="blog-preview__card">
              <p class="blog-preview__name">Для чего нужны коллаборации</p>
              <div class="blog-preview__img">
                <picture>
                  <source width="425" height="415" type="image/webp" media="(min-width: 768px)" srcset="img/articles/1-tablet@1x.webp 1x, img/articles/1-tablet@2x.webp 2x">
                  <source width="335" height="416" type="image/webp" srcset="img/articles/1-mobile@1x.webp 1x, img/articles/1-mobile@2x.webp 2x">
                  <source width="425" height="415" type="image/jpg" media="(min-width: 768px)" srcset="img/articles/1-tablet@1x.jpg 1x, img/articles/1-tablet@2x.jpg 2x">
                  <img src="img/articles/1-mobile@1x.jpg" srcset="img/articles/1-mobile@2x.jpg 2x" width="335" height="416" alt="Логотип компании">
                </picture>
              </div>
              <div class="blog-preview__bottom">
                <p class="blog-preview__category">Коллаборации</p>
                <p class="blog-preview__date">Дата</p>
              </div>
            </div>
          </li>
          <li class="blog-preview__slide">
            <div class="blog-preview__card">
              <p class="blog-preview__name">Как выйти в&nbsp;топ</p>
              <div class="blog-preview__img">
                <picture>
                  <source width="425" height="415" type="image/webp" media="(min-width: 768px)" srcset="img/articles/2-tablet@1x.webp 1x, img/articles/2-tablet@2x.webp 2x">
                  <source width="335" height="416" type="image/webp" srcset="img/articles/1-mobile@1x.webp 1x, img/articles/1-mobile@2x.webp 2x">
                  <source width="425" height="415" type="image/jpg" media="(min-width: 768px)" srcset="img/articles/2-tablet@1x.jpg 1x, img/articles/2-tablet@2x.jpg 2x">
                  <img src="img/articles/1-mobile@1x.jpg" srcset="img/articles/1-mobile@2x.jpg 2x" width="335" height="416" alt="Логотип компании">
                </picture>
              </div>
              <div class="blog-preview__bottom">
                <p class="blog-preview__category">Полезное</p>
                <p class="blog-preview__date">Дата</p>
              </div>
            </div>
          </li>
          <li class="blog-preview__slide">
            <div class="blog-preview__card">
              <p class="blog-preview__name">Как влияют подкасты на&nbsp;пиар</p>
              <div class="blog-preview__img">
                <picture>
                  <source width="425" height="415" type="image/webp" media="(min-width: 768px)" srcset="img/articles/3-tablet@1x.webp 1x, img/articles/3-tablet@2x.webp 2x">
                  <source width="335" height="416" type="image/webp" srcset="img/articles/1-mobile@1x.webp 1x, img/articles/1-mobile@2x.webp 2x">
                  <source width="425" height="415" type="image/jpg" media="(min-width: 768px)" srcset="img/articles/3-tablet@1x.jpg 1x, img/articles/3-tablet@2x.jpg 2x">
                  <img src="img/articles/1-mobile@1x.jpg" srcset="img/articles/1-mobile@2x.jpg 2x" width="335" height="416" alt="Логотип компании">
                </picture>
              </div>
              <div class="blog-preview__bottom">
                <p class="blog-preview__category">Подкасты</p>
                <p class="blog-preview__date">Дата</p>
              </div>
            </div>
          </li>
          <li class="blog-preview__slide">
            <div class="blog-preview__card">
              <p class="blog-preview__name">Как попасть на&nbsp;ТВ через пиар</p>
              <div class="blog-preview__img">
                <picture>
                  <source width="425" height="415" type="image/webp" media="(min-width: 768px)" srcset="img/articles/4-tablet@1x.webp 1x, img/articles/4-tablet@2x.webp 2x">
                  <source width="335" height="416" type="image/webp" srcset="img/articles/1-mobile@1x.webp 1x, img/articles/1-mobile@2x.webp 2x">
                  <source width="425" height="415" type="image/jpg" media="(min-width: 768px)" srcset="img/articles/4-tablet@1x.jpg 1x, img/articles/4-tablet@2x.jpg 2x">
                  <img src="img/articles/1-mobile@1x.jpg" srcset="img/articles/1-mobile@2x.jpg 2x" width="335" height="416" alt="Логотип компании">
                </picture>
              </div>
              <div class="blog-preview__bottom">
                <p class="blog-preview__category">ТВ</p>
                <p class="blog-preview__date">Дата</p>
              </div>
            </div>
          </li>
        </ul>
        <div class="blog-preview__swiper-button-container hidden">
          <button class="button-swiper button-swiper--prev" type="button">
            <span class="visually-hidden">Назад.</span>
          </button>
          <button class="button-swiper button-swiper--next" type="button">
            <span class="visually-hidden">Вперёд.</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
